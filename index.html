<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ashutosh &amp; Rakhi · 30 Nov – 3 Dec 2026</title>
<meta name="description" content="You are invited to our wedding celebrations" />

<meta property="og:title" content="Ashutosh &amp; Rakhi · 30 Nov – 3 Dec 2026" />
<meta property="og:description" content="You are invited to our wedding celebrations" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ashutosk1.github.io/ashutosh-rakhi/" />
<meta property="og:image" content="https://ashutosk1.github.io/ashutosh-rakhi/assets/og-image.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Ashutosh &amp; Rakhi · 30 Nov – 3 Dec 2026" />
<meta name="twitter:description" content="You are invited to our wedding celebrations" />
<meta name="twitter:image" content="https://ashutosk1.github.io/ashutosh-rakhi/assets/og-image.jpg" />

<meta name="theme-color" content="#7a1712" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

<div class="top-band">
  <p class="hi" lang="hi">।। शुभ विवाह ।।</p>
</div>
<div class="banner banner-top" aria-hidden="true"></div>

<main class="scroll">

<!-- ============================== HERO ============================== -->
<header id="hero">
  <div class="hero-mark">
    <img class="swastika" src="assets/gen/swastika.png" alt="" aria-hidden="true" />
    <figure class="tile hero-ganesh">
      <img src="assets/gen/ganesh.png" width="222" height="225"
           alt="Shri Ganesh seated on a lotus inside a floral medallion" />
    </figure>
    <img class="swastika" src="assets/gen/swastika.png" alt="" aria-hidden="true" />
  </div>

  <div class="nameplate">
    <h1 class="hi-display" lang="hi">
      <span data-bind="groomHi"></span> <span class="amp">संग</span> <span data-bind="brideHi"></span>
    </h1>
    <p class="nameplate-en"><span data-bind="groomEn"></span> <span class="amp">&amp;</span> <span data-bind="brideEn"></span></p>
  </div>

  <p class="hero-date">
    <span class="hi" lang="hi" data-bind="dateRangeHi"></span>
    <span data-bind="dateRangeEn"></span>
  </p>

  <a class="scroll-cue" href="#invocation" aria-label="Scroll to the invitation">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>

<!-- ============================== INVOCATION ============================== -->
<section id="invocation" class="panel invocation reveal">
  <blockquote lang="hi" data-bind="invocationHi"></blockquote>
</section>

<!-- ============================== INVITATION WORDS ============================== -->
<section class="panel framed invitation-panel reveal">
  <img class="corner tl" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner tr" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner bl" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner br" src="assets/gen/corner.png" alt="" aria-hidden="true" />

  <img class="seal" src="assets/gen/fish-circle.png" width="600" height="600" loading="lazy"
       alt="A Madhubani fish among lotuses in a circular frame" />

  <div class="invitation-hi" data-bind="invitationHi" lang="hi"></div>
  <p class="invitation-en" data-bind="invitationEn"></p>
</section>

<div class="divider" aria-hidden="true"></div>

<h2 class="section-title reveal">
  <span class="hi-display" lang="hi">शुभ कार्यक्रम</span>
  <span class="section-title-en">The Celebrations</span>
</h2>

<!-- ============================== CEREMONIES ============================== -->
<div class="ceremonies">
<article class="panel ceremony reveal" data-panel="tilak" style="--accent: var(--turmeric-deep);">
  <figure class="tile">
    <img src="assets/gen/kalash.png" width="202" height="227" loading="lazy"
         alt="A decorated kalash with mango leaves and a coconut, flanked by lotuses" />
  </figure>
  <div class="ceremony-body">
    <header class="ceremony-head">
      <span class="name-hi hi-display" lang="hi" data-bind="nameHi"></span>
      <span class="name-en" data-bind="nameEn"></span>
    </header>
    <div class="ceremony-meta">
      <span class="date-badge" data-bind="date"></span>
    </div>
  </div>
</article>

<article class="panel ceremony reveal" data-panel="mandap" style="--accent: var(--leaf);">
  <figure class="tile">
    <img src="assets/gen/bamboo.png" width="173" height="266" loading="lazy"
         alt="A grove of bamboo and banana leaves, from which the wedding mandap is built" />
  </figure>
  <div class="ceremony-body">
    <header class="ceremony-head">
      <span class="name-hi hi-display" lang="hi" data-bind="nameHi"></span>
      <span class="name-en" data-bind="nameEn"></span>
    </header>
    <div class="ceremony-meta">
      <span class="date-badge" data-bind="date"></span>
    </div>
  </div>
</article>

<article class="panel ceremony reveal" data-panel="ghritdhari" style="--accent: var(--marigold-deep);">
  <figure class="tile">
    <img src="assets/gen/diya.png" width="241" height="230" loading="lazy"
         alt="A lit diya beside a painted ghee pot, surrounded by marigolds" />
  </figure>
  <div class="ceremony-body">
    <header class="ceremony-head">
      <span class="name-hi hi-display" lang="hi" data-bind="nameHi"></span>
      <span class="name-en" data-bind="nameEn"></span>
    </header>
    <div class="ceremony-meta">
      <span class="date-badge" data-bind="date"></span>
    </div>
  </div>
</article>

<article class="panel ceremony reveal" data-panel="vivaah" style="--accent: var(--sindoor);">
  <figure class="tile">
    <img src="assets/gen/varmala.png" width="450" height="720" loading="lazy"
         alt="The Jaimala: bride and groom exchanging flower garlands inside a floral medallion, with Ganesh above and fish and a kalash below" />
  </figure>
  <div class="ceremony-body">
    <header class="ceremony-head">
      <span class="name-hi hi-display" lang="hi" data-bind="nameHi"></span>
      <span class="name-en" data-bind="nameEn"></span>
    </header>
    <div class="ceremony-meta">
      <span class="date-badge" data-bind="date"></span>
    </div>
  </div>
</article>
</div>

<!-- ============================== BARAAT ============================== -->
<section class="baraat-band" aria-labelledby="baraat-heading">
  <div class="baraat-inner reveal">
    <h2 id="baraat-heading" class="hi-display" lang="hi">बारात प्रस्थान</h2>
    <p class="baraat-sub">The Baraat sets out</p>
    <p class="baraat-route">
      <strong data-bind="baraatFrom"></strong>
      <span class="arrow" aria-hidden="true">→</span>
      <strong data-bind="baraatTo"></strong>
    </p>
    <p class="baraat-when" data-bind="baraatDate"></p>
  </div>
  <div class="baraat-stage">
    <div class="baraat-art" role="img"
         aria-label="A painted baraat procession: an elephant, a doli carried by bearers, drummers, and the groom on horseback under parasols"></div>
  </div>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- ============================== VENUES ============================== -->
<section class="panel reveal" aria-labelledby="venues-heading">
  <h2 class="section-title in-panel">
    <span id="venues-heading" class="hi-display" lang="hi">स्थान</span>
    <span class="section-title-en">Venues</span>
  </h2>

  <div class="venues-grid">
    <div class="venue-card" data-venue="priyadarshika">
      <h3 class="hi-display" lang="hi" data-bind="venueNameHi"></h3>
      <p class="venue-name-en" data-bind="venueNameEn"></p>
      <p class="venue-role" data-bind="venueRole"></p>
      <address data-bind="venueAddress"></address>
      <div class="map-embed-wrap">
        <iframe data-bind="venueEmbed" loading="lazy" title="Map to Priyadarshika" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <a class="link-maps" data-bind="venueMapsLink" target="_blank" rel="noopener">Open in Google Maps →</a>
      <div class="getting-there">
        <p><strong>Getting there</strong></p>
        <p>✈️ <span data-bind="venueAirport"></span></p>
        <p>🚉 <span data-bind="venueRail"></span></p>
      </div>
    </div>

    <div class="venue-card" data-venue="kapson">
      <h3 class="hi-display" lang="hi" data-bind="venueNameHi"></h3>
      <p class="venue-name-en" data-bind="venueNameEn"></p>
      <p class="venue-role" data-bind="venueRole"></p>
      <address data-bind="venueAddress"></address>
      <div class="map-embed-wrap">
        <iframe data-bind="venueEmbed" loading="lazy" title="Map to Hotel Kapson" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <a class="link-maps" data-bind="venueMapsLink" target="_blank" rel="noopener">Open in Google Maps →</a>
      <div class="getting-there">
        <p><strong>Getting there</strong></p>
        <p>✈️ <span data-bind="venueAirport"></span></p>
        <p>🚉 <span data-bind="venueRail"></span></p>
      </div>
    </div>
  </div>
</section>

<!-- ============================== CLOSING ============================== -->
<section class="panel framed closing reveal">
  <img class="corner tl" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner tr" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner bl" src="assets/gen/corner.png" alt="" aria-hidden="true" />
  <img class="corner br" src="assets/gen/corner.png" alt="" aria-hidden="true" />

  <figure class="tile tile-sm">
    <img src="assets/gen/surya.png" width="251" height="242" loading="lazy"
         alt="Surya and Chandra — the sun and moon joined in one medallion, a symbol of lasting togetherness" />
  </figure>
  <p class="blessing-hi hi" lang="hi" data-bind="closingBlessing"></p>
  <p class="signature">
    <span data-bind="closingSignature"></span><br/>
    <strong data-bind="closingFamily"></strong>
  </p>
</section>

</main>

<div class="banner banner-bottom" aria-hidden="true"></div>

<footer class="site-footer" aria-hidden="true"></footer>

<script src="script.js?v=6"></script>
</body>
</html>
